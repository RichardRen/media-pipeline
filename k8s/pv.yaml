apiVersion: v1
kind: PersistentVolume
metadata:
  name: shared-storage-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany  # 允许多个 Pod 读写
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  hostPath:
    path: "/Volumes/REMOVABLE_DISK/视频/Youtube"  # ⚠️ 这里是宿主机上的路径

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: "/Volumes/REMOVABLE_DISK/视频/k8s_data/postgres"  # ⚠️ 本机存储路径，请确保目录存在

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: rabbitmq-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: "/Volumes/REMOVABLE_DISK/视频/k8s_data/rabbitmq"  # ⚠️ 本机存储路径，请确保目录存在
