apiVersion: apps/v1
kind: Deployment
metadata:
  name: translator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: translator
  template:
    metadata:
      labels:
        app: translator
    spec:
      containers:
      - name: translator
        image: everbloomingren/ytb_video_image:latest
        env:
        # 进程标识
        - name: PROCESS_TYPE
          value: "translator"
        # PostgreSQL 连接信息
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "videos"
        - name: POSTGRES_USER
          value: "user"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: media-pipeline-secrets
              key: POSTGRES_PASSWORD
        # RabbitMQ 连接信息
        - name: MQ_HOST
          value: "rabbitmq"
        - name: MQ_PORT
          value: "5672"
        - name: MQ_USER
          value: "user"
        - name: MQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: media-pipeline-secrets
              key: MQ_PASSWORD
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: media-pipeline-secrets
              key: OPENAI_API_KEY
        volumeMounts:
        - name: shared-storage
          mountPath: /app/data  # 共享目录
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: shared-storage-pvc
