apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1  # 只需运行一个 RabbitMQ 实例
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:management
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: "user"
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: media-pipeline-secrets
              key: MQ_PASSWORD
        ports:
        - containerPort: 5672  # AMQP 端口（应用程序连接）
        - containerPort: 15672 # Web 管理界面
        volumeMounts:
        - name: rabbitmq-storage
          mountPath: /var/lib/rabbitmq  # 持久化 RabbitMQ 数据
      volumes:
      - name: rabbitmq-storage
        persistentVolumeClaim:
          claimName: rabbitmq-pvc
